<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antispeech">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <title>Antispeech - Control por Voz de IDE</title>

  <!-- Marked.js para formatear respuestas Markdown en el celular -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 28, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .brand-title {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      transition: background 0.3s;
    }

    .status-dot.online {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-dot.thinking {
      background: #a855f7;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 16px;
      gap: 14px;
    }

    /* Diagnostic log bar on phone */
    .diag-banner {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .diag-text {
      color: #cbd5e1;
      font-family: ui-monospace, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .diag-text.warn { color: #fbbf24; }
    .diag-text.err { color: #f87171; font-weight: 600; }
    .diag-text.ok { color: #34d399; }

    /* Audio visualizer canvas */
    .visualizer-box {
      width: 100%;
      height: 38px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
    .visualizer-box.active {
      display: block;
    }

    canvas#audioVisualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Response / Chat Feed */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 250px;
      margin-bottom: 240px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      animation: fadeIn 0.25s ease-out;
      font-size: 14.5px;
      line-height: 1.55;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(79, 70, 229, 0.15));
      border-color: rgba(99, 102, 241, 0.4);
      max-width: 90%;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-color: var(--card-border);
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .msg-content {
      word-break: break-word;
    }

    .msg-content pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .msg-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #38bdf8;
    }

    .msg-content p {
      margin-bottom: 8px;
    }
    .msg-content p:last-child {
      margin-bottom: 0;
    }

    .msg-content ul, .msg-content ol {
      margin-left: 20px;
      margin-bottom: 8px;
    }

    .tts-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #a5b4fc;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tts-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Bottom Control Deck */
    .controls-deck {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(9, 13, 22, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .controls-inner {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .transcription-bar {
      width: 100%;
      min-height: 40px;
      max-height: 95px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transcription-text {
      flex: 1;
      white-space: pre-wrap;
    }

    .transcription-text.empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .transcription-text.interim {
      color: #93c5fd;
    }

    .mic-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .btn-mic {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-mic:active {
      transform: scale(0.92);
    }

    .btn-mic.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
      animation: pulseRecord 1.4s infinite;
    }

    @keyframes pulseRecord {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .btn-mic svg {
      width: 34px;
      height: 34px;
      fill: currentColor;
    }

    .btn-aux {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-aux:hover, .btn-aux:active {
      background: rgba(255, 255, 255, 0.16);
      color: white;
    }

    .btn-aux.send {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-aux.send:hover {
      background: var(--accent);
      color: white;
    }

    .btn-stop-speech {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .config-pills {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      user-select: none;
    }
    .pill.active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--primary);
      color: #a5b4fc;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open {
      display: flex;
    }
    .modal-box {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .form-group input, .form-group select {
      background: #1f2937;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: white;
      padding: 8px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">🎙️</div>
      <div>
        <div class="brand-title">Antispeech IDE</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Conectando...</span>
      </div>
      <button class="btn-aux" style="width: 34px; height: 34px;" id="btnOpenSettings" title="Configuración">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Main Feed -->
  <main>
    <!-- Live diagnostic banner -->
    <div class="diag-banner">
      <span class="diag-text" id="diagMsg">Sincronizando chat en tiempo real...</span>
      <button class="pill" id="btnToggleSpeech" style="font-size:10.5px; padding:2px 6px;">🔊 Voz: ON</button>
    </div>

    <!-- Live Audio Equalizer / Waveform -->
    <div class="visualizer-box" id="visBox">
      <canvas id="audioVisualizer" height="38"></canvas>
    </div>

    <!-- Chat Stream / Feed -->
    <div class="chat-section" id="chatFeed">
      <!-- Mensajes cargados dinámicamente -->
    </div>
  </main>

  <!-- Sticky Bottom Controls Deck -->
  <div class="controls-deck">
    <div class="controls-inner">
      <!-- Live transcription box -->
      <div class="transcription-bar">
        <div class="transcription-text empty" id="transcriptText">
          Toca el micrófono para comenzar a hablar...
        </div>
        <button class="btn-aux" id="btnClearText" style="display:none; width: 28px; height: 28px; font-size: 11px;" title="Borrar">✕</button>
      </div>

      <!-- Action buttons -->
      <div class="mic-center">
        <!-- Cancel button -->
        <button class="btn-aux" id="btnCancelVoice" title="Cancelar dictado">
          ✕
        </button>

        <!-- Big Mic button -->
        <button class="btn-mic" id="btnMic" title="Hablar">
          <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>

        <!-- Stop Speech button -->
        <button class="btn-aux btn-stop-speech" id="btnStopSpeech" title="Detener lectura de voz">
          ⏹️
        </button>

        <!-- Manual Send button -->
        <button class="btn-aux send" id="btnSendPrompt" title="Enviar prompt al IDE">
          ➤
        </button>
      </div>

      <!-- Config pills -->
      <div class="config-pills">
        <span class="pill active" id="pillEngine">🎙️ Grabación Directa</span>
        <span class="pill active" id="toggleAutoSend">⚡ Auto-envío: ON</span>
        <span class="pill active" id="toggleTTS">🔊 Voz IA: ON</span>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>Configuración</span>
        <button class="btn-aux" style="width: 30px; height: 30px;" id="btnCloseSettings">✕</button>
      </div>
      <div class="form-group">
        <label>Motor de Voz</label>
        <select id="cfgEngine">
          <option value="server" selected>Servidor Local (MediaRecorder + ffmpeg)</option>
          <option value="browser">Navegador Web Speech API</option>
        </select>
      </div>
      <div class="form-group">
        <label>Idioma</label>
        <select id="cfgLanguage">
          <option value="es-ES" selected>Español</option>
          <option value="en-US">English</option>
        </select>
      </div>
      <div class="form-group">
        <label>Silencio para auto-enviar (ms)</label>
        <input type="number" id="cfgSilenceTimeout" value="1400" min="500" max="4000" step="100">
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="cfgAutoTTS" checked> Leer automáticamente las respuestas de la IA
        </label>
      </div>
      <button class="btn-mic" style="width: 100%; height: 42px; border-radius: 8px; font-weight: 600; margin-top: 8px;" id="btnSaveSettings">
        Guardar Ajustes
      </button>
    </div>
  </div>

  <script>
    const state = {
      serverUrl: window.location.origin,
      engine: localStorage.getItem('antispeech_engine') || 'server',
      language: localStorage.getItem('antispeech_lang') || 'es-ES',
      autoSend: localStorage.getItem('antispeech_autosend') !== 'false',
      silenceTimeout: parseInt(localStorage.getItem('antispeech_silence') || '1400', 10),
      autoTTS: localStorage.getItem('antispeech_tts') !== 'false', // Activado por defecto
      isRecording: false,
      transcript: '',
      silenceTimer: null,
      mediaStream: null,
      mediaRecorder: null,
      audioChunks: [],
      audioContext: null,
      analyser: null,
      animFrameId: null,
      recognition: null,
      renderedSteps: new Set(),
      lastSpokenStep: -1,
      speechUnlocked: false
    };

    // Desbloquear Audio & SpeechSynthesis en el primer toque del usuario
    function unlockAudioAndSpeech() {
      if (state.speechUnlocked) return;
      try {
        if (window.speechSynthesis) {
          const silentUtter = new SpeechSynthesisUtterance(' ');
          silentUtter.volume = 0.01;
          window.speechSynthesis.speak(silentUtter);
        }
        state.speechUnlocked = true;
      } catch (e) {}
    }
    window.addEventListener('touchstart', unlockAudioAndSpeech, { once: true });
    window.addEventListener('click', unlockAudioAndSpeech, { once: true });

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
    requestWakeLock();

    const btnMic = document.getElementById('btnMic');
    const transcriptText = document.getElementById('transcriptText');
    const btnClearText = document.getElementById('btnClearText');
    const btnCancelVoice = document.getElementById('btnCancelVoice');
    const btnSendPrompt = document.getElementById('btnSendPrompt');
    const btnStopSpeech = document.getElementById('btnStopSpeech');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const chatFeed = document.getElementById('chatFeed');
    const diagMsg = document.getElementById('diagMsg');
    const pillEngine = document.getElementById('pillEngine');
    const btnToggleSpeech = document.getElementById('btnToggleSpeech');
    const toggleTTS = document.getElementById('toggleTTS');
    const visBox = document.getElementById('visBox');
    const canvas = document.getElementById('audioVisualizer');
    const canvasCtx = canvas.getContext('2d');

    function setDiag(msg, type = 'info') {
      diagMsg.textContent = msg;
      diagMsg.className = 'diag-text';
      if (type === 'warn') diagMsg.classList.add('warn');
      if (type === 'err') diagMsg.classList.add('err');
      if (type === 'ok') diagMsg.classList.add('ok');
    }

    function updateTTSPill() {
      btnToggleSpeech.textContent = state.autoTTS ? '🔊 Voz: ON' : '🔇 Voz: OFF';
      toggleTTS.textContent = state.autoTTS ? '🔊 Voz IA: ON' : '🔇 Voz IA: OFF';
      toggleTTS.classList.toggle('active', state.autoTTS);
    }
    updateTTSPill();

    btnToggleSpeech.addEventListener('click', () => {
      state.autoTTS = !state.autoTTS;
      localStorage.setItem('antispeech_tts', state.autoTTS);
      updateTTSPill();
      if (!state.autoTTS && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    toggleTTS.addEventListener('click', () => {
      state.autoTTS = !state.autoTTS;
      localStorage.setItem('antispeech_tts', state.autoTTS);
      updateTTSPill();
      if (!state.autoTTS && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    btnStopSpeech.addEventListener('click', () => {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      btnStopSpeech.style.display = 'none';
      setDiag('Lectura de voz detenida.', 'warn');
    });

    // =========================================================
    // LECTURA EN VOZ ALTA (TEXT-TO-SPEECH)
    // =========================================================
    function speakText(rawContent, stepIndex = null) {
      if (!window.speechSynthesis) return;

      // Si ya se leyó este paso específico, no repetirlo en bucle
      if (stepIndex !== null && stepIndex <= state.lastSpokenStep) return;
      if (stepIndex !== null) state.lastSpokenStep = stepIndex;

      window.speechSynthesis.cancel();

      // Limpiar texto para lectura natural en voz alta
      let textToSpeak = rawContent
        .replace(/```[\s\S]*?```/g, ' He dejado el código en tu pantalla. ')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/#{1,6}\s+/g, '')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/[>•\-]/g, '')
        .trim();

      if (!textToSpeak) return;

      // Limitar a los primeros 800 caracteres para respuestas fluidas
      if (textToSpeak.length > 800) {
        textToSpeak = textToSpeak.substring(0, 800) + '... El resto de la respuesta está en tu pantalla.';
      }

      const utter = new SpeechSynthesisUtterance(textToSpeak);
      utter.lang = 'es-ES';
      utter.rate = 1.05;

      utter.onstart = () => {
        btnStopSpeech.style.display = 'flex';
        setDiag('🔊 Leyendo respuesta en voz alta...', 'ok');
      };

      utter.onend = () => {
        btnStopSpeech.style.display = 'none';
        setDiag('✓ Lectura completada.', 'ok');
      };

      utter.onerror = (e) => {
        btnStopSpeech.style.display = 'none';
      };

      window.speechSynthesis.speak(utter);
    }

    // =========================================================
    // RENDERIZADO DEL CHAT
    // =========================================================
    function renderHistory(historyList) {
      if (!historyList || historyList.length === 0) return;

      historyList.forEach((msg) => {
        const msgId = `msg-${msg.role}-${msg.step}`;
        if (!state.renderedSteps.has(msgId)) {
          state.renderedSteps.add(msgId);

          const el = document.createElement('div');
          el.id = msgId;
          el.className = `message ${msg.role}`;

          const isUser = msg.role === 'user';
          const senderName = isUser ? 'Tú (Voz)' : '🤖 Antigravity';
          const htmlContent = isUser ? escapeHtml(msg.text) : marked.parse(msg.text);

          el.innerHTML = `
            <div class="msg-header">
              <span>${senderName}</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <span>${msg.time || ''}</span>
                ${!isUser ? `<button class="tts-btn" onclick="speakTextFromCard('${msgId}')">🔊 Escuchar</button>` : ''}
              </div>
            </div>
            <div class="msg-content">${htmlContent}</div>
          `;

          chatFeed.appendChild(el);
          el.scrollIntoView({ behavior: 'smooth' });
        }
      });
    }

    window.speakTextFromCard = function(msgId) {
      const card = document.getElementById(msgId);
      if (card) {
        const content = card.querySelector('.msg-content').innerText;
        speakText(content);
      }
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }

    function setIDEStatus(label, type) {
      statusLabel.textContent = label;
      statusDot.className = 'status-dot';
      if (type === 'online') statusDot.classList.add('online');
      else if (type === 'thinking') statusDot.classList.add('thinking');
    }

    // =========================================================
    // CONEXIÓN EN TIEMPO REAL (HISTORIAL Y STREAMING SSE)
    // =========================================================
    async function loadInitialHistory() {
      try {
        const res = await fetch(`${state.serverUrl}/api/history`);
        if (res.ok) {
          const data = await res.json();
          setIDEStatus(data.is_generating ? 'Antigravity pensando...' : 'Listo', data.is_generating ? 'thinking' : 'online');
          if (data.history) renderHistory(data.history);

          // Si hay una última respuesta disponible al abrir la app
          if (data.latest && data.latest.step) {
            state.lastSpokenStep = data.latest.step; // Evitar que hable la respuesta vieja al recargar
          }
        }
      } catch (e) {
        setIDEStatus('Desconectado', 'error');
      }
    }

    function connectSSE() {
      try {
        const es = new EventSource(`${state.serverUrl}/api/stream`);

        es.onopen = () => setIDEStatus('Conectado a PC', 'online');

        es.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (!data) return;

            setIDEStatus(data.is_generating ? 'Antigravity pensando...' : 'Listo', data.is_generating ? 'thinking' : 'online');

            if (data.history) renderHistory(data.history);

            // Si se completó una nueva respuesta del asistente
            if (!data.is_generating && data.latest && data.latest.text) {
              const step = data.latest.step;
              if (state.autoTTS && step > state.lastSpokenStep) {
                speakText(data.latest.text, step);
              }
            }
          } catch(e) {}
        };

        es.onerror = () => {
          es.close();
          setTimeout(connectSSE, 2500);
        };
      } catch (e) {
        setTimeout(connectSSE, 2500);
      }
    }

    loadInitialHistory().then(connectSSE);

    // =========================================================
    // GRABACIÓN DE AUDIO (MEDIARECORDER A BASE64)
    // =========================================================
    async function startMediaRecorder() {
      unlockAudioAndSpeech();
      try {
        setDiag('Accediendo al micrófono...', 'info');
        state.audioChunks = [];

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        state.mediaStream = stream;

        startAudioVisualizer(stream);

        const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg', 'audio/mp4', ''];
        let chosenMime = '';
        for (const m of mimeTypes) {
          if (!m || MediaRecorder.isTypeSupported(m)) {
            chosenMime = m;
            break;
          }
        }

        const options = chosenMime ? { mimeType: chosenMime } : {};
        const recorder = new MediaRecorder(stream, options);

        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) state.audioChunks.push(e.data);
        };

        recorder.onstart = () => {
          state.isRecording = true;
          btnMic.classList.add('recording');
          setDiag('🎙️ Grabando audio... Habla ahora', 'ok');
          setIDEStatus('Escuchando...', 'thinking');
          transcriptText.textContent = 'Escuchando tu voz... Habla con naturalidad.';
          transcriptText.className = 'transcription-text interim';
        };

        recorder.onstop = async () => {
          stopAudioVisualizer();
          btnMic.classList.remove('recording');

          if (state.audioChunks.length === 0) {
            setDiag('No se detectó audio.', 'warn');
            return;
          }

          const blob = new Blob(state.audioChunks, { type: chosenMime || 'audio/webm' });
          await uploadAudioToServer(blob);
        };

        recorder.start(200);
        state.mediaRecorder = recorder;

      } catch (err) {
        setDiag(`Error de micrófono: ${err.message}`, 'err');
        stopRecording();
      }
    }

    function stopMediaRecorder() {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
      }
      if (state.mediaStream) {
        state.mediaStream.getTracks().forEach(track => track.stop());
        state.mediaStream = null;
      }
      state.isRecording = false;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.substring(reader.result.indexOf(',') + 1));
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function uploadAudioToServer(audioBlob) {
      setDiag('📤 Transfiriendo audio a la PC y transcribiendo...', 'info');
      setIDEStatus('Transcribiendo...', 'thinking');
      transcriptText.textContent = 'Procesando tu voz en la PC...';

      try {
        const base64Audio = await blobToBase64(audioBlob);

        const res = await fetch(`${state.serverUrl}/api/audio`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audio_base64: base64Audio,
            lang: state.language
          })
        });

        const data = await res.json();

        if (data.status === 'ok') {
          const text = data.text;
          setDiag(`✓ Inyectado en IDE: "${text.slice(0, 35)}..."`, 'ok');
          setIDEStatus('Prompt inyectado en IDE', 'online');
          transcriptText.textContent = text;
          transcriptText.className = 'transcription-text';
          btnClearText.style.display = 'block';

          // Agregar mensaje de usuario inmediatamente
          renderHistory([{
            role: 'user',
            step: Date.now(),
            text: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
        } else {
          const errMsg = data.message || 'No se reconoció voz clara.';
          setDiag(`⚠️ ${errMsg}`, 'warn');
          transcriptText.textContent = errMsg;
          setIDEStatus('Listo', 'online');
        }
      } catch (err) {
        setDiag(`Error de conexión: ${err.message}`, 'err');
        setIDEStatus('Error de conexión', 'error');
      }
    }

    // --- Ecualizador Vúmetro ---
    function startAudioVisualizer(stream) {
      try {
        visBox.classList.add('active');
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = state.audioContext.createMediaStreamSource(stream);
        state.analyser = state.audioContext.createAnalyser();
        state.analyser.fftSize = 64;
        source.connect(state.analyser);

        const bufferLength = state.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        let silenceStart = Date.now();
        let hasSpoken = false;

        function draw() {
          state.animFrameId = requestAnimationFrame(draw);
          state.analyser.getByteFrequencyData(dataArray);

          canvasCtx.fillStyle = 'rgba(9, 13, 22, 0.6)';
          canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

          let sum = 0;
          const barWidth = (canvas.width / bufferLength) * 1.5;
          let x = 0;

          for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;
            sum += dataArray[i];

            canvasCtx.fillStyle = `rgb(${dataArray[i] + 50}, 99, 241)`;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
            x += barWidth;
          }

          const avgVolume = sum / bufferLength;
          if (avgVolume > 18) {
            hasSpoken = true;
            silenceStart = Date.now();
          } else if (hasSpoken && state.autoSend) {
            if (Date.now() - silenceStart > state.silenceTimeout) {
              stopMediaRecorder();
            }
          }
        }
        draw();
      } catch (e) {}
    }

    function stopAudioVisualizer() {
      visBox.classList.remove('active');
      if (state.animFrameId) cancelAnimationFrame(state.animFrameId);
      if (state.audioContext) {
        state.audioContext.close().catch(() => {});
        state.audioContext = null;
      }
    }

    // Botones de acción
    btnMic.addEventListener('click', () => {
      unlockAudioAndSpeech();
      if (state.isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      state.transcript = '';
      transcriptText.textContent = 'Iniciando micrófono...';
      transcriptText.className = 'transcription-text interim';
      startMediaRecorder();
    }

    function stopRecording() {
      stopMediaRecorder();
    }

    btnCancelVoice.addEventListener('click', () => {
      stopRecording();
      state.transcript = '';
      transcriptText.textContent = 'Toca el micrófono para comenzar a hablar...';
      transcriptText.className = 'transcription-text empty';
      btnClearText.style.display = 'none';
      setDiag('Dictado cancelado.', 'warn');
    });

    btnClearText.addEventListener('click', () => {
      state.transcript = '';
      transcriptText.textContent = 'Toca el micrófono para comenzar a hablar...';
      transcriptText.className = 'transcription-text empty';
      btnClearText.style.display = 'none';
    });

    btnSendPrompt.addEventListener('click', () => {
      if (state.isRecording) stopRecording();
    });

    // Modal Ajustes
    const modal = document.getElementById('settingsModal');
    document.getElementById('btnOpenSettings').addEventListener('click', () => {
      document.getElementById('cfgLanguage').value = state.language;
      document.getElementById('cfgSilenceTimeout').value = state.silenceTimeout;
      document.getElementById('cfgAutoTTS').checked = state.autoTTS;
      modal.classList.add('open');
    });

    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    document.getElementById('btnSaveSettings').addEventListener('click', () => {
      state.language = document.getElementById('cfgLanguage').value;
      state.silenceTimeout = parseInt(document.getElementById('cfgSilenceTimeout').value, 10);
      state.autoTTS = document.getElementById('cfgAutoTTS').checked;

      localStorage.setItem('antispeech_lang', state.language);
      localStorage.setItem('antispeech_silence', state.silenceTimeout);
      localStorage.setItem('antispeech_tts', state.autoTTS);

      updateTTSPill();
      modal.classList.remove('open');
    });

    const toggleAutoSend = document.getElementById('toggleAutoSend');
    toggleAutoSend.addEventListener('click', () => {
      state.autoSend = !state.autoSend;
      localStorage.setItem('antispeech_autosend', state.autoSend);
      toggleAutoSend.textContent = `⚡ Auto-envío: ${state.autoSend ? 'ON' : 'OFF'}`;
      toggleAutoSend.classList.toggle('active', state.autoSend);
    });
  </script>
</body>
